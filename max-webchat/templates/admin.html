<!DOCTYPE html>
<html>
<head>
    <title>Панель управления ИИ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>👨‍💼 Управление клиентами MAX</h2>
        <table class="table table-white table-hover mt-4">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>ID</th>
                    <th>Режим ИИ</th>
                    <th>Сценарий</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody>
                {% for c in clients %}
                <tr>
                    <td>{{ c[1] }}</td>
                    <td><code>{{ c[0] }}</code></td>
                    <td>{{ "✅ ВКЛ" if c[2] == 1 else "❌ ВЫКЛ" }}</td>
                    <td><span class="badge bg-primary">{{ c[3] }}</span></td>
                    <td><a href="/chat/{{ c[0] }}" class="btn btn-sm btn-outline-dark">Открыть чат</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
